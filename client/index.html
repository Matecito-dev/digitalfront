<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Velis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050810; }
    #app { width: 100%; height: 100%; }
    #gate, #lab-shell { width: 100%; height: 100%; }
    #gate {
      display: flex; align-items: center; justify-content: center;
      color: #e6edf3; font: 14px/1.5 system-ui, sans-serif; padding: 24px; text-align: center;
    }
    #gate .card {
      max-width: 420px; padding: 28px 24px; border: 1px solid #30363d;
      border-radius: 8px; background: #161b22;
    }
    #gate h1 { font-size: 18px; color: #58a6ff; margin-bottom: 12px; }
    #gate p { color: #8b949e; margin-bottom: 12px; }
    #gate code { background: #21262d; padding: 2px 6px; border-radius: 4px; }
    #gate a { color: #58a6ff; }
    #lab-shell { display: none; }
  </style>
  <script>
    (function () {
      var lab = new URLSearchParams(location.search).get("lab") === "1";
      if (lab) {
        document.addEventListener("DOMContentLoaded", function () {
          document.getElementById("gate").style.display = "none";
          document.getElementById("lab-shell").style.display = "block";
        });
        return;
      }
      var q = location.search || "";
      location.replace("http://localhost:3333/" + q);
    })();
  </script>
</head>
<body>
  <div id="gate">
    <div class="card">
      <h1>Velis</h1>
      <p>Redirigiendo al juego…</p>
      <p>Si no carga, arrancá el servidor:</p>
      <p><code>npm run dev</code></p>
      <p><a href="http://localhost:3333/">http://localhost:3333/</a></p>
    </div>
  </div>
  <div id="lab-shell">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </div>
</body>
</html>
